name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: "1785340800"
      VERSION: "0.01"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Install NDK r29
        run: |
          ndk_path="$ANDROID_HOME/ndk/29.0.14206865"
          if [ ! -f "$ndk_path/source.properties" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865"
          fi
          printf 'ANDROID_NDK_HOME=%s\n' "$ndk_path" >> "$GITHUB_ENV"
      - name: Build and verify
        run: sh ./scripts/build-ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZCR521-Android-AI-MCP-v0.01
          path: dist/
          if-no-files-found: error
